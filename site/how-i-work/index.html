  .hint{font-size:13px;color:var(--eye);margin:12px 0 0}
  footer{margin-top:36px;font-size:13px;color:var(--eye)}
  footer a{color:var(--acc)}
  @media (prefers-reduced-motion: reduce){svg animate,svg animateMotion{display:none}}
</style>

<script>
const STEPS = {
  people: { t: 'People first', d: "I talk to the people doing the work, watch how it really runs and research the field before I suggest anything. Most of what decides a project is found here, not in the code.", see: [['ByJoseM case study', 'https://github.com/AIwithDiego/byjosem-case-study'], ['attendance-mcp', 'https://github.com/AIwithDiego/attendance-mcp']] },
  problem: { t: 'The problem worth solving', d: "Out of everything I hear, I pick the problem that costs someone time, money or risk every week, and that software can honestly fix.", see: [['AI Exposure Scan', 'https://github.com/AIwithDiego/ai-exposure-scan#research'], ['AI Act Check', 'https://github.com/AIwithDiego/ai-act-check#the-problem']] },
  build: { t: "Only what's worth making", d: "I decide what's worth making and, just as important, what isn't. Then I build that, owning the product decisions and the code, and I use agents to build faster without handing them the judgment.", see: [['AI Act Check: the prep and the build', 'https://github.com/AIwithDiego/ai-act-check#preparation'], ['humanizer-es', 'https://github.com/AIwithDiego/humanizer-es']] },
  review: { t: 'Design review before code', d: "Anything non-trivial gets a written design first, reviewed from four angles: product, architecture, QA and security. Then a fixed contract, so parts can be built in parallel without guessing.", see: [['AI Act Check contract', 'https://github.com/AIwithDiego/ai-act-check/blob/main/docs/contract.md'], ['AIgentSmith architecture', 'https://github.com/AIwithDiego/aigentsmith-architecture']] },
  law: { t: 'EU AI Act and GDPR from day one', d: "Compliance is designed in, not bolted on. Hank, the security and EU-compliance reviewer I made, checks every project before it ships.", see: [['Hank', 'https://github.com/AIwithDiego/hank'], ['AI Act Check', 'https://github.com/AIwithDiego/ai-act-check']] },
  evals: { t: "The owner's rules, as evals", d: "The business owner's rules become typed checks and an AI-judge rubric that run on every change an agent proposes. Tests on everything that ships; for agent behaviour that means evals with deterministic checks.", see: [['taste-to-evals', 'https://github.com/AIwithDiego/taste-to-evals']] },
  human: { t: 'A human approves', d: "Before an agent acts on a business, a person approves it, and sees enough to make a real decision, not just \"Allow?\".", see: [['Haven', 'https://github.com/AIwithDiego/haven'], ['taste-to-evals', 'https://github.com/AIwithDiego/taste-to-evals']] },
  run: { t: 'Run it, own it, learn', d: "I ship it and run it in production, keep owning it, and go back to the people using it. What they tell me starts the next loop.", see: [['Gym Routine Builder', 'https://github.com/AIwithDiego/gym-routine-builder'], ['Robogotchi', 'https://github.com/AIwithDiego/robogotchi']] },
};
const panel = document.getElementById('panel');
function show(id) {
  const s = STEPS[id]; if (!s) return;
  document.querySelectorAll('.node').forEach(n => n.classList.toggle('on', n.dataset.id === id));
  panel.replaceChildren();
  const h = document.createElement('h2'); h.textContent = s.t;
  const p = document.createElement('p'); p.textContent = s.d;
  const see = document.createElement('div');
  const lab = document.createElement('span'); lab.className = 'see'; lab.textContent = 'See it in'; see.append(lab);
  for (const [name, url] of s.see) { const a = document.createElement('a'); a.href = url; a.textContent = name + ' ↗'; a.target = '_blank'; a.rel = 'noopener'; see.append(a); }
  panel.append(h, p, see);
}
document.querySelectorAll('.node').forEach(n => {
  n.setAttribute('tabindex', '0'); n.setAttribute('role', 'button');
  n.addEventListener('click', () => show(n.dataset.id));
  n.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); show(n.dataset.id); } });
});
show('problem');
</script>
